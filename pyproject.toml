[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ayurnidana"
version = "1.0.0"
description = "Systematic Ayurvedic Clinical Diagnostic and Treatment Expert System"
authors = [{ name = "AyurNidana Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "pandas>=2.2.0",
    "notebooklm-py>=0.8.2",
    "python-dotenv>=1.0.1"
]

[project.scripts]
ayurnidana = "ayurnidana.ui.app:main"

[tool.setuptools]
packages = ["ayurnidana"]
