services:
  - type: web
    name: ayurnidana-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn ayurnidana.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
